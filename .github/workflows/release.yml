name: Release

# Trois façons de publier, parce qu'il y a trois façons de s'y prendre.
#
# 1. `release: published` — **le cas de l'interface GitHub**. Publier une release depuis
#    le site n'émet pas de `push` de tag : le tag est créé par l'API, ce qui déclenche
#    `create` et `release`, pas `push`. Sans cette entrée, une release faite à la souris
#    reste sans artefact, et c'est exactement ce qui est arrivé à `2.0.0-RC0`.
# 2. `push` d'un tag — le cas ligne de commande, `git tag 1.2.3 && git push origin 1.2.3`.
#    Le préfixe « v » est facultatif et un suffixe de pré-version est accepté, sans quoi
#    `2.0.0-RC0` ne correspondait à rien.
# 3. `workflow_dispatch` — reprise manuelle, pour rattraper une release déjà publiée.
on:
  release:
    types: [published]
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: "Tag à publier (ex. 2.0.0-RC0, ou v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

# Filet de sécurité : si un même tag déclenchait deux fois le workflow, deux exécutions
# téléverseraient les mêmes fichiers sur la même release. On garde la dernière.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Construire et publier
    runs-on: ubuntu-latest
    # Déclaré au niveau du job : le contexte `secrets` n'est pas consultable depuis un
    # `if:` d'étape, alors qu'une variable d'environnement de job l'est.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : nécessaire pour dériver le versionCode du nombre de commits.
          fetch-depth: 0
          # En reprise manuelle, `github.ref` est la branche : on force le tag demandé,
          # sinon on construirait la pointe de master et non la version publiée.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Déterminer la version
        id: version
        env:
          # Chaque évènement porte le tag ailleurs : `release` dans sa charge utile,
          # `push` dans la réf, `workflow_dispatch` dans son entrée.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            release)          TAG="$RELEASE_TAG" ;;
            workflow_dispatch) TAG="$INPUT_TAG" ;;
            *)                TAG="$GITHUB_REF_NAME" ;;
          esac
          # Le « v » n'est qu'une convention de nommage du tag : v1.2.3 -> 1.2.3.
          # Un suffixe de pré-version, lui, est conservé : « 2.0.0-RC0 » est un
          # versionName parfaitement valide, et c'est une information utile.
          VERSION="${TAG#v}"
          # versionCode monotone : le nombre de commits ne peut que croître.
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "name=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG -> version $VERSION (versionCode $VERSION_CODE)"

      # On ne publie jamais une version qui ne passe pas les tests.
      - name: Vérifications
        run: ./gradlew spotlessCheck detekt build

      - name: Restaurer le keystore
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Construire l'AAB et l'APK signés
        env:
          GABUZOMEU_VERSION_NAME: ${{ steps.version.outputs.name }}
          GABUZOMEU_VERSION_CODE: ${{ steps.version.outputs.code }}
          GABUZOMEU_STORE_FILE: ${{ steps.keystore.outputs.path }}
          GABUZOMEU_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GABUZOMEU_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GABUZOMEU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Sans les secrets de signature, la configuration release est simplement absente
        # et les artefacts sortent non signés — le build reste vert.
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: gabuzomeu-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      - name: Publier les artefacts sur la release
        uses: softprops/action-gh-release@v2
        with:
          # Explicite : en reprise manuelle, `github.ref` est une branche et l'action
          # publierait sur une pseudo-release nommée d'après elle.
          tag_name: ${{ steps.version.outputs.tag }}
          name: GaBuZoMeu ${{ steps.version.outputs.name }}
          # Sur une release déjà publiée à la main, on ajoute les fichiers sans réécrire
          # les notes que l'auteur a rédigées.
          generate_release_notes: ${{ github.event_name != 'release' }}
          # Une release sans APK est précisément le symptôme à ne plus jamais laisser
          # passer en silence : si le glob ne trouve rien, le job échoue.
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
