name: Release

# Déclenché par un tag de version. Le tag pilote le numéro de version de l'artefact :
# `git tag v1.2.3 && git push origin v1.2.3` produit un AAB et un APK en 1.2.3.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le « v » (ex. 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Construire et publier
    runs-on: ubuntu-latest
    # Déclaré au niveau du job : le contexte `secrets` n'est pas consultable depuis un
    # `if:` d'étape, alors qu'une variable d'environnement de job l'est.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : nécessaire pour dériver le versionCode du nombre de commits.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # refs/tags/v1.2.3 -> 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # versionCode monotone : le nombre de commits ne peut que croître.
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "name=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE"  >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (versionCode $VERSION_CODE)"

      # On ne publie jamais une version qui ne passe pas les tests.
      - name: Vérifications
        run: ./gradlew spotlessCheck detekt build

      - name: Restaurer le keystore
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Construire l'AAB et l'APK signés
        env:
          GABUZOMEU_VERSION_NAME: ${{ steps.version.outputs.name }}
          GABUZOMEU_VERSION_CODE: ${{ steps.version.outputs.code }}
          GABUZOMEU_STORE_FILE: ${{ steps.keystore.outputs.path }}
          GABUZOMEU_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GABUZOMEU_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GABUZOMEU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Sans les secrets de signature, la configuration release est simplement absente
        # et les artefacts sortent non signés — le build reste vert.
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: gabuzomeu-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: GaBuZoMeu ${{ steps.version.outputs.name }}
          generate_release_notes: true
          draft: false
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
